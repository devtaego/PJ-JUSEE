<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <title>관리자 로그인 | JUSEE</title>
</head>
<body class="site-page">
<main class="narrow-shell">
    <p class="brand-mark">JUSEE / Control Room</p>
    <section class="surface hero-card">
        <p class="eyebrow">Private access</p>
        <h1>시장 운영자<br>로그인</h1>
        <p class="lede">게임을 만들고 참가자를 확인한 뒤 시장을 시작합니다.</p>
        <form class="entry-form" action="{{ url_for('admin_login') }}" method="POST">
            <label class="field-label" for="admin-password">관리자 비밀번호</label>
            <input class="input" id="admin-password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required autofocus>
            <button class="primary-button" type="submit">관리자 화면 열기</button>
        </form>
        <a class="inline-link" href="{{ url_for('index') }}">플레이어 입장으로 돌아가기</a>
    </section>
</main>
</body>
</html>
