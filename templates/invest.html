<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>투자 화면</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>투자 화면</h1>

    <div class="money">
        보유 현금 : 10,000,000원
    </div>

    <hr>

    <h2>종목</h2>

    <div class="stock">
        <h3>삼성전자</h3>
        <p>현재가 : 70,000원</p>

        <button>매수</button>
        <button>매도</button>
    </div>

    <div class="stock">
        <h3>현대차</h3>
        <p>현재가 : 200,000원</p>

        <button>매수</button>
        <button>매도</button>
    </div>

    <div class="stock">
        <h3>카카오</h3>
        <p>현재가 : 50,000원</p>

        <button>매수</button>
        <button>매도</button>
    </div>

</body>
</html>
